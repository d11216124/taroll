        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

            const shuffled = shuffleArray(TAROT_CARDS);
            return shuffled.slice(0, count);
        }

            return Math.random() < reversedProb ? "reversed" : "upright";

            }
            return "（尚無牌義）";

            const cards = drawCards(positions.length);

            const results = cards.map((card, index) => {
                const orientation = determineOrientation(reversedProb);
                const position = positions[index];
                const meaning = getMeaning(card, orientation, topic);
                const advice = getAdvice(card, orientation);

                return {
                    card,
                    orientation,
                    position,
                    meaning,
                    advice
                };
            });

            currentDrawing = {
                topic,
                question,
                spread,
                results
            };

            renderResults();
            updateStatus("drawn", "已抽牌");
        }

        // ========== RENDERING ==========
        function renderResults() {
            const resultsContainer = document.getElementById("results");
            
            if (!currentDrawing) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🌟</div>
                        <p>選擇設定後點擊「抽牌」開始</p>
                    </div>
                `;
                return;
            }

            const cardsHtml = currentDrawing.results.map((result, index) => {
                const { card, orientation, position, meaning, advice } = result;
                const orientationLabel = orientation === "upright" ? "正位" : "逆位";
                const keywords = card.keywords.slice(0, 3);

                return `
                    <div class="card">
                        <div class="card-header">
                            <div class="card-name">${card.name}</div>
                            <span class="badge ${orientation}">${orientationLabel}</span>
                        </div>
                        <div class="card-position">${index + 1}. ${position.label}</div>
                        <div class="card-keywords">
                            ${keywords.map(kw => `<span class="keyword">${kw}</span>`).join("")}
                        </div>
                        <div class="card-meaning">${meaning}</div>
                        ${advice ? `<div class="card-advice">建議：${advice}</div>` : ""}
                    </div>
                `;
            }).join("");

            resultsContainer.innerHTML = cardsHtml;
        }

        function updateStatus(type, message) {
            const statusElement = document.getElementById("status");
            statusElement.className = `status ${type}`;
            statusElement.textContent = message;
        }

        // ========== COPY TO CLIPBOARD ==========
        function copyResults() {
            if (!currentDrawing) {
                updateStatus("error", "尚未抽牌");
                setTimeout(() => updateStatus("waiting", "待抽牌"), 2000);
                return;
            }

            const { topic, question, spread, results } = currentDrawing;
            const topicLabel = TOPIC_LABELS[topic];
            const spreadLabel = SPREAD_LABELS[spread];

            let text = "塔羅抽牌結果\n";
            text += `主題：${topicLabel}\n`;
            text += `牌陣：${spreadLabel}\n`;
            if (question) {
                text += `問題：${question}\n`;
            }
            text += "---\n";

            results.forEach((result, index) => {
                const { card, orientation, position, meaning, advice } = result;
                const orientationLabel = orientation === "upright" ? "正位" : "逆位";
                text += `${index + 1}. ${position.label}：${card.name}（${orientationLabel}）\n`;
                text += `   解讀：${meaning}\n`;
                if (advice) {
                    text += `   建議：${advice}\n`;
                }
                if (index < results.length - 1) {
                    text += "\n";
                }
            });

            // Try modern clipboard API first
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text)
                    .then(() => {
                        updateStatus("drawn", "✓ 已複製到剪貼簿");
                        setTimeout(() => updateStatus("drawn", "已抽牌"), 2000);
                    })
                    .catch(() => {
                        fallbackCopy(text);
                    });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand("copy");
                updateStatus("drawn", "✓ 已複製到剪貼簿");
                setTimeout(() => updateStatus("drawn", "已抽牌"), 2000);
            } catch (err) {
                updateStatus("error", "複製失敗");
                setTimeout(() => updateStatus("drawn", "已抽牌"), 2000);
            }
            
            document.body.removeChild(textarea);
        }

        // ========== RESET ==========
        function reset() {
            document.getElementById("topic").value = "general";
            document.getElementById("question").value = "";
            document.getElementById("spread").value = "three";
            document.getElementById("reversedProb").value = "0.5";
            
            currentDrawing = null;
            renderResults();
            updateStatus("waiting", "待抽牌");
        }

        // ========== EVENT HANDLERS ==========
        document.getElementById("drawBtn").addEventListener("click", performDraw);
        document.getElementById("redrawBtn").addEventListener("click", performDraw);
        document.getElementById("copyBtn").addEventListener("click", copyResults);
        document.getElementById("resetBtn").addEventListener("click", reset);

        // ========== KEYBOARD SHORTCUTS ==========
        document.addEventListener("keydown", (e) => {
            // Don't trigger shortcuts when typing in input/textarea
            if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") {
                return;
            }

            const key = e.key.toUpperCase();
            
            switch (key) {
                case "D":
                    e.preventDefault();
                    performDraw();
                    break;
                case "R":
                    e.preventDefault();
                    performDraw();
                    break;
                case "C":
                    e.preventDefault();
                    copyResults();
                    break;
                case "ESCAPE":
                    e.preventDefault();
                    reset();
                    break;
            }
        });

        // ========== INITIALIZE ==========
        renderResults();
    </script>
</body>
</html>
